<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Marketing Hierarchy</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 900px;
        }
        .link {
            fill: none;
            stroke: #555;
            stroke-opacity: 0.6;
            stroke-width: 2px;
        }
        .node circle {
            stroke: #555;
            stroke-width: 2px;
            transition: all 0.3s ease-in-out;
        }
        .node.parent circle {
            fill: #ff5733; /* Parent nodes color */
        }
        .node.child circle {
            fill: #33ff57; /* Child nodes color */
        }
        .node.parent text {
            font-size: 16px;
            font-weight: bold;
            fill: red;
        }
        .node.child text {
            font-size: 12px;
            fill: #4d26b8;
        }
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        svg {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="container mt-4">
    <h2 class="text-center text-primary mb-4">Network Marketing Hierarchy</h2>
    
    <div class="form-container">
        <form id="memberForm">
            <div class="mb-3">
                <label for="name" class="form-label">Member Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter member name" required>
            </div>
            <div class="mb-3">
                <label for="parent" class="form-label">UpLine</label>
                <select id="parent" class="form-control">
                    <option value="">None (Top Level)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">DownLine</button>
        </form>
    </div>

    <h3 class="text-center mt-4">Visual Hierarchy</h3>
    <svg width="800" height="600"></svg>
<script>
    $(document).ready(function () {
    let members = JSON.parse(localStorage.getItem("members")) || [];

    function saveToLocalStorage() {
        localStorage.setItem("members", JSON.stringify(members));
    }

    function updateParentDropdown() {
        let parentSelect = $("#parent");
        parentSelect.empty();
        parentSelect.append('<option value="">None (Top Level)</option>');
        members.forEach(member => {
            parentSelect.append(`<option value="${member.name}">${member.name}</option>`);
        });
    }

    function buildHierarchy() {
        let map = {};
        members.forEach(m => map[m.name] = { name: m.name, children: [] });

        let rootChildren = [];
        members.forEach(m => {
            if (m.parent) {
                if (map[m.parent]) {
                    map[m.parent].children.push(map[m.name]);
                }
            } else {
                rootChildren.push(map[m.name]);
            }
        });

        return { name: "Root", children: rootChildren };
    }

    function renderGraph() {
        d3.select("svg").selectAll("*").remove();

        let data = buildHierarchy();
        let width = 800, height = 600;

        let svg = d3.select("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        let g = svg.append("g").attr("transform", `translate(${width / 2}, 50)`);

        let zoom = d3.zoom()
            .scaleExtent([0.5, 2])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        let tree = d3.tree().size([height - 150, width - 250]);
        let root = d3.hierarchy(data);

        tree(root);

        // Links
        g.selectAll(".link")
            .data(root.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("fill", "none")
            .attr("stroke", "#555")
            .attr("stroke-width", 2)
            .attr("opacity", 0.6)
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x)
            );

        // Nodes
        let node = g.selectAll(".node")
            .data(root.descendants())
            .enter().append("g")
            .attr("class", d => `node ${d.depth === 0 ? 'root' : d.depth === 1 ? 'parent' : 'child'}`)
            .attr("transform", d => `translate(${d.y},${d.x})`);

        node.append("circle")
            .attr("r", 8)
            .attr("fill", d => d.depth === 0 ? "#007bff" : d.depth === 1 ? "#ff5733" : "#33ff57")
            .attr("stroke", "#000")
            .attr("stroke-width", 2);

        node.append("text")
            .attr("dy", 4)
            .attr("x", 12)
            .attr("fill", d => d.depth === 0 ? "blue" : d.depth === 1 ? "red" : "#4d26b8")
            .attr("font-size", d => d.depth === 0 ? "18px" : d.depth === 1 ? "16px" : "12px")
            .attr("font-weight", d => d.depth === 0 ? "bold" : d.depth === 1 ? "bold" : "normal")
            .text(d => d.data.name);
    }

    updateParentDropdown();
    renderGraph();

    $("#memberForm").submit(function (event) {
        event.preventDefault();

        let name = $("#name").val().trim();
        let parent = $("#parent").val() || null;

        if (!name) return;

        members.push({ name, parent });
        saveToLocalStorage();
        updateParentDropdown();
        renderGraph();

        $("#name").val("");
    });
});

</script>
</body>
</html>
